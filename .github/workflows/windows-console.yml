name: Matea native Windows console oracle
on:
  push:
    paths:
      - .github/workflows/windows-console.yml
      - scripts/test_windows_console.py
      - scripts/windows_console_oracle.ps1
      - tools/perf-probe/src/main.rs
      - tools/perf-probe/src/progress.rs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  console:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - run: cargo build --locked --release -p matea-perf-probe
      - run: python scripts/test_windows_console.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-native-console
          path: docs/evidence/windows-console
          if-no-files-found: warn
          retention-days: 14
